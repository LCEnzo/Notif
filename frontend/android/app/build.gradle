plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// `flutter build` sets this from --build-number (or pubspec's +N) and removes it when neither is given.
def flutterVersionCode = localProperties.getProperty("flutter.versionCode")

def requireReleaseVersionCode = tasks.register("requireReleaseVersionCode") {
    def versionCodeGiven = flutterVersionCode != null
    doLast {
        if (!versionCodeGiven) {
            throw new GradleException(
                "Release builds need an explicit versionCode: pass --build-number to `flutter build`. " +
                "Without it the APK would silently get versionCode 1."
            )
        }
    }
}
// Also hooked to the Dart compile so the check fails before the slow AOT step.
tasks.matching { it.name in ["preReleaseBuild", "compileFlutterBuildRelease"] }.configureEach {
    dependsOn requireReleaseVersionCode
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace "com.lcenzo.notif"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.lcenzo.notif"
        // Health Connect's connect-client 1.1.0 needs 26; set explicitly rather than inherit Flutter's default.
        minSdk 26
        targetSdk flutter.targetSdkVersion
        // Debug and profile builds may fall back to 1; release builds are stopped above.
        versionCode((flutterVersionCode ?: "1").toInteger())
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Debug-signed on purpose: the release key is applied after the build, with apksigner.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
