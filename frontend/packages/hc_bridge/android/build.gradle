// Built only as part of the app: AGP and the Kotlin plugin come from the app's
// settings.gradle, so no versions here.
plugins {
    id "com.android.library"
    id "kotlin-android"
}

group = "com.lcenzo.notif.hc_bridge"
version = "0.1.0"

android {
    namespace "com.lcenzo.notif.hc_bridge"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // connect-client 1.1.0's floor.
        minSdk 26
    }

    testOptions {
        unitTests {
            // android.os stubs (RemoteException, Build) return defaults on the JVM.
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // alpha03 is built against connect-client 1.1.0-beta02 and resolves up to
    // 1.1.0; alpha04 would pull 1.2.0-alpha05 into the test classpath.
    testImplementation "androidx.health.connect:connect-testing:1.0.0-alpha03"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
}
