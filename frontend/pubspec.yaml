name: notif
description: Notif frontend, an automated web scraper designed to push notifications to users whenever updates appear on monitored websites, blogs, and forums.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.3.0

environment:
  sdk: '>=3.11.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  dio: ^5.8.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  go_router: ^17.2.1
  json_annotation: ^4.9.0
  package_info_plus: ^10.0.0
  provider: ^6.0.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.1.12
  web: ^1.1.0


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # cupertino_icons: ^1.0.2

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  shared_preferences_platform_interface: ^2.4.2
  # swagger_dart_code_generator emits the Dart models the FE parses responses
  # into, from backend/openapi.json. It runs via build_runner; the generated
  # output is committed (see frontend/scripts/refresh_contract.py).
  swagger_dart_code_generator: ^4.1.1

  # very_good_analysis is the active analyzer preset. flutter_lints stays
  # available so Flutter's recommended preset is not removed from the toolchain.
  very_good_analysis: ^10.2.0

# Config for the one-off flutter_launcher_icons generator.
# Keep the package out of dev_dependencies so normal CI/build dependency
# resolution does not pull the icon generator and its image/archive stack.
flutter_launcher_icons:
  image_path: assets/notif-ring-1-cyan-dark-1024.png
  android: true
  ios: true
  web:
    generate: true
  macos:
    generate: true
  windows:
    generate: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  shaders:
    - shaders/auth_texture.frag
    - shaders/dither_overlay.frag

  fonts:
    - family: Awesome
      fonts:
        - asset: fonts/AwesomeSerifVAR-VF.ttf
    - family: InstrumentSerif
      fonts:
        - asset: fonts/InstrumentSerif-Regular.ttf
        - asset: fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: Skyling
      fonts:
        - asset: fonts/SLTFSkylingVF.ttf
    - family: InterTight
      fonts:
        - asset: fonts/InterTight-VariableFont_wght.ttf
        - asset: fonts/InterTight-Italic-VariableFont_wght.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-wght.ttf
        - asset: fonts/JetBrainsMono-Italic-wght.ttf
          style: italic
    - family: Newsreader
      fonts:
        - asset: fonts/Newsreader-VariableFont_opsz,wght.ttf
        - asset: fonts/Newsreader-Italic-VariableFont_opsz,wght.ttf
          style: italic
    - family: ZalandoSans
      fonts:
        - asset: fonts/ZalandoSansExpanded-VariableFont_wght.ttf
        - asset: fonts/ZalandoSansExpanded-Italic-VariableFont_wght.ttf
          style: italic
    - family: SuisseMono
      fonts:
        - asset: fonts/SuisseMono-15b3dab70b38c29f-s.p.otf

  assets:
    - assets/notif-ring-1-cyan-dark-1024.svg
    - assets/notif-ring-1-cyan-dark-1024.png
    - assets/notif-ring-1-cyan-light-1024.svg
    - assets/notif-ring-1-cyan-light-1024.png
    - assets/notif-ring-1-dusk-dark-1024.svg
    - assets/notif-ring-1-dusk-dark-1024.png
    - assets/notif-ring-1-dusk-light-1024.svg
    - assets/notif-ring-1-dusk-light-1024.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
