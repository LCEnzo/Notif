# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated by swagger_dart_code_generator from backend/openapi.json
    # (see frontend/scripts/refresh_contract.py). Not hand-maintained, so
    # lint noise there is noise. The dio-boundary architecture test still
    # reads these files directly and keeps enforcing its rules.
    - lib/generated/**

linter:
  rules:
    # Trial very_good_analysis with existing low-noise project rules first.
    # Re-enable the disabled rules incrementally when the current churn is paid down.
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    collection_methods_unrelated_type: true
    no_literal_bool_comparisons: true
    no_self_assignments: true
    prefer_const_constructors: true
    unawaited_futures: true

    # Still-noisy style/doc rules that don't fit this app yet
    always_put_required_named_parameters_first: false
    avoid_escaping_inner_quotes: false
    avoid_positional_boolean_parameters: false
    avoid_private_typedef_functions: false
    avoid_redundant_argument_values: false
    avoid_types_on_closure_parameters: false
    cascade_invocations: false
    comment_references: false
    document_ignores: false
    lines_longer_than_80_chars: false
    omit_local_variable_types: false
    one_member_abstracts: false
    parameter_assignments: false
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_constructors_over_static_methods: true
    prefer_final_locals: true
    prefer_int_literals: false
    prefer_single_quotes: false
    public_member_api_docs: false
    specify_nonobvious_property_types: false
    unnecessary_breaks: false
    unnecessary_ignore: false
    unnecessary_raw_strings: false
    use_colored_box: false
    use_setters_to_change_properties: false
