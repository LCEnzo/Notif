[project]
name = "notif-backend"
version = "0.1.0"
description = "Django backend for Notif"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
	"beautifulsoup4>=4.13,<5.0",
	"django>=6.0,<6.1",
	"django-cors-headers>=4.9,<5.0",
	"djangorestframework>=3.17,<3.18",
	"djangorestframework-simplejwt>=5.5,<5.6",
	"lxml>=6.0,<7.0",
	"python-dotenv>=1.1,<2.0",
	"requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
	"django-stubs[compatible-mypy]>=6.0,<6.1",
	"djangorestframework-stubs[compatible-mypy]>=3.16.8,<3.17",
	"faker>=40.13,<41.0",
	"ipython>=9.2,<10.0",
	"mypy>=1.11,<2.0",
	"pytest>=9.0.3,<10.0",
	"pytest-django>=4.11,<5.0",
	"requests-mock>=1.11,<2.0",
	"ruff>=0.15.9,<0.16.0",
	"types-requests>=2.32.4.20260107,<3.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
	"**/node_modules",
	"**/__pycache__",
	"**/experimental",
	"**/typestubs",
	"**/migrations",
	".venv",
	"venv",
]

[tool.ruff.lint]
select = [
	"E",     # pycodestyle
	"F",     # pyflakes
	"W",     # pycodestyle warnings
	"UP",    # pyupgrade
	"I",     # isort
	"N",     # pep8-naming
	"ASYNC", # flake8-async
	"B",     # flake8-bugbear
	"C4",    # flake8-comprehensions
	"DTZ",   # flake8-datetimez
	"DJ",    # flake8-django
	"RET",   # flake8-return
	"SIM",   # flake8-simplify
	"RUF100",# unused-noqa
]
ignore = ["E501", "RET501", "RET504", "SIM103", "SIM108", "SIM118", "W191"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
exclude = [
	"**/node_modules",
	"**/__pycache__",
	"**/experimental",
	"**/migrations",
	".venv",
	"venv", 
	"**/.*",
]
ignore = []
defineConstant = { DEBUG = true }
stubPath = "stubs"
venv = ".venv"

reportMissingImports = true
reportMissingTypeStubs = true

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations", "\\.venv", "venv"]
python_version = "3.13"
check_untyped_defs = true
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "notif.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "notif.settings"
pythonpath = ["."]
