[project]
name = "notif-backend"
version = "0.3.0"
description = "Django backend for Notif"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
	"beautifulsoup4>=4.13,<5.0",
	"django>=6.0,<6.1",
	"drf-spectacular>=0.29.0,<0.30.0",
	"feedparser>=6.0,<7.0",
	"gunicorn>=26.0,<27.0",
	"django-cors-headers>=4.9,<5.0",
	"djangorestframework>=3.17,<3.18",
	"djangorestframework-simplejwt>=5.5,<5.6",
	"lxml>=6.1.0,<7.0",
	"pydantic-settings>=2.0,<3.0",
	"python-dotenv>=1.1,<2.0",
	"requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
	"django-silk>=5.3,<6.0",
	"django-stubs[compatible-mypy]>=6.0,<6.1",
	"djangorestframework-stubs[compatible-mypy]>=3.16.8,<3.17",
	"faker>=40.13,<41.0",
	"hypothesis>=6.152,<7.0",
	"ipython>=9.2,<10.0",
	"mypy>=1.11,<2.0",
	"pytest>=9.0.3,<10.0",
	"pytest-cov>=7.0,<8.0",
	"pytest-django>=4.11,<5.0",
	"pytest-randomly>=4.0,<5.0",
	"pytest-timeout>=2.3,<3.0",
	"pytest-xdist>=3.8,<4.0",
	"requests-mock>=1.11,<2.0",
	"ruff>=0.15.9,<0.16.0",
	"types-requests>=2.32.4.20260107,<3.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
	"**/node_modules",
	"**/__pycache__",
	"**/experimental",
	"**/typestubs",
	"**/migrations",
	".venv",
	"venv",
]

[tool.ruff.lint]
select = [
	"E",     # pycodestyle
	"F",     # pyflakes
	"W",     # pycodestyle warnings
	"UP",    # pyupgrade
	"I",     # isort
	"N",     # pep8-naming
	"ASYNC", # flake8-async
	"B",     # flake8-bugbear
	"C4",    # flake8-comprehensions
	"DTZ",   # flake8-datetimez
	"DJ",    # flake8-django
	"RET",   # flake8-return
	"SIM",   # flake8-simplify
	"T201",  # use of print, can leak secrets in logs
	"PTH",
	"RUF100",# unused-noqa
]
ignore = ["E501", "RET501", "RET504", "SIM103", "SIM108", "SIM118", "W191"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "pydantic.mypy"]
exclude = ["migrations", "\\.venv", "venv"]
mypy_path = "stubs"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
warn_unreachable = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["*.tests", "*.tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.django-stubs]
django_settings_module = "notif.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "notif.settings"
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = [
	"-ra",
	"--strict-markers",
	"--strict-config",
	"--tb=short",
	"--reuse-db",
	"--nomigrations",
	"--timeout=30",
	"-n",
	"4",
]
markers = [
    "slow: marks tests that use real downloaded fixtures (deselect with -m 'not slow')",
    "feed: marks tests specific to FeedStrategy",
    "e2e: end-to-end tests using real downloaded feeds — most directly test parsing correctness",
    "property: Hypothesis property-based tests that verify invariants across generated inputs",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "manage.py",
    "notif/asgi.py",
    "notif/wsgi.py",
    "*/management/commands/*",
]

[tool.coverage.report]
fail_under = 80
