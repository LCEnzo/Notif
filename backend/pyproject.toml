[project]
name = "notif-backend"
version = "0.3.0"
description = "Django backend for Notif"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
	"beautifulsoup4>=4.13,<5.0",
	"django>=6.1.1,<6.2",
	"drf-spectacular>=0.30.0,<0.31.0",
	"feedparser>=6.0,<7.0",
	"gunicorn>=26.0,<27.0",
	"django-cors-headers>=4.9,<5.0",
	"djangorestframework>=3.18.1,<3.19",
	"lxml>=6.1.0,<7.0",
	"pydantic-settings>=2.14.2,<3.0",
	"python-dotenv>=1.1,<2.0",
	"requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
	"detect-secrets>=1.5,<2.0",
	"django-silk>=5.3,<6.0",
	"django-stubs[compatible-mypy]>=6.1.1,<6.2",
	"djangorestframework-stubs[compatible-mypy]>=3.18.1,<3.19",
	"faker>=40.13,<41.0",
	"hypothesis>=6.152,<7.0",
	"ipython>=9.2,<10.0",
	"mypy>=2.3,<3.0",
	"openapi-core>=0.23.1,<1.0",
	"pytest>=9.0.3,<10.0",
	"pytest-cov>=7.0,<8.0",
	"pytest-django>=4.11,<5.0",
	"pytest-randomly>=5.0,<6.0",
	"pytest-socket>=0.7,<0.8",
	"pytest-timeout>=2.3,<3.0",
	"pytest-xdist>=3.8,<4.0",
	"requests-mock>=1.11,<2.0",
	"ruff>=0.16.1,<0.17.0",
	"schemathesis>=4.24,<5.0",
	"types-requests>=2.32.4.20260107,<3.0",
]
mutation = [
    "mutmut>=3.7,<4.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
	"**/node_modules",
	"**/__pycache__",
	"**/experimental",
	"**/typestubs",
	"**/migrations",
	".venv",
	"venv",
]

[tool.ruff.lint]
select = [
	"E",     # pycodestyle
	"F",     # pyflakes
	"W",     # pycodestyle warnings
	"UP",    # pyupgrade
	"I",     # isort
	"N",     # pep8-naming
	"ASYNC", # flake8-async
	"B",     # flake8-bugbear
	"C4",    # flake8-comprehensions
	"DTZ",   # flake8-datetimez
	"DJ",    # flake8-django
	"RET",   # flake8-return
	"SIM",   # flake8-simplify
	"TID251",  # banned-api: outbound HTTP goes through monitoring.safe_fetch (see banned-api below)
	"T201",  # use of print, can leak secrets in logs
	"PTH",
	"RUF100",# unused-noqa
	"ISC004",  # implicit str concat in collection literals (missing-comma typo)
	"LOG004",  # .exception() outside an except handler
	"PLE0304", # __bool__ returning non-bool
	"PLR1708", # raise StopIteration inside a generator (PEP 479 RuntimeError)
	"RUF036",  # None goes last in unions
	"RUF063",  # fragile __dict__ annotations access under PEP 649 (py3.14)
	"RUF068",  # duplicate entries in __all__
	"FURB164", # Decimal/Fraction .from_float() over constructor
	"FURB192", # sorted(x)[0] instead of min/max
	# pylint errors (PLE), bug-class, adopted wholesale
	"PLE0100", # yield/yield from in `__init__` turns it into a generator
	"PLE0101", # `__init__` must not return a value
	"PLE0115", # name declared both `nonlocal` and `global`
	"PLE0116", # `continue` inside a `finally` block
	"PLE0117", # `nonlocal` name without an enclosing binding
	"PLE0118", # name used before its `global` declaration
	"PLE0237", # assignment to attribute not defined in `__slots__`
	"PLE0241", # duplicate base class in a class definition
	"PLE0302", # special method with an unexpected signature
	"PLE0303", # `__len__` must return a non-negative integer
	"PLE0305", # `__index__` must return an integer
	"PLE0307", # `__str__` must return a `str`
	"PLE0308", # `__bytes__` must return `bytes`
	"PLE0309", # `__hash__` must return an integer
	"PLE0604", # invalid object in `__all__`
	"PLE0605", # invalid assignment to `__all__`
	"PLE0643", # hard-coded sequence access known to be out of bounds
	"PLE0704", # bare `raise` outside an exception handler
	"PLE1132", # repeated keyword argument in a function call
	"PLE1142", # `await` used outside an `async` function
	"PLE1205", # too many positional args for a logging format string
	"PLE1206", # too few positional args for a logging format string
	"PLE1300", # unsupported format type in a format string
	"PLE1307", # mismatched argument type in an old-style format string
	"PLE1310", # duplicate characters in a `str.strip` call
	"PLE1507", # `os.getenv` call with an invalid `key` argument
	"PLE1519", # method decorated with `@singledispatch`
	"PLE1520", # function decorated with `@singledispatchmethod`
	"PLE1700", # `yield from` inside an async function
	"PLE2502", # bidirectional unicode formatting characters
	"PLE2510", # string containing the raw control character `BS`
	"PLE2512", # string containing the raw control character `SUB`
	"PLE2513", # string containing the raw control character `ESC`
	"PLE2514", # string containing the raw control character `NUL`
	"PLE2515", # string containing the zero width space character
	# pylint warnings (PLW), probable-mistake class, adopted wholesale
	"PLW0108", # lambda wrapping a function call with the same arguments
	"PLW0120", # `else` clause on a loop without `break`
	"PLW0127", # variable assigned to itself
	"PLW0128", # same name assigned multiple times in one statement
	"PLW0129", # `assert` on a string literal (always true)
	"PLW0131", # named expression replaceable by a plain assignment
	"PLW0133", # exception created but never raised
	"PLW0177", # comparison against NaN (always false)
	"PLW0211", # staticmethod using `self`/`cls` as first arg
	"PLW0245", # `super` used without parentheses
	"PLW0406", # module importing itself
	"PLW0602", # `global` name not assigned in current scope
	"PLW0603", # use of `global` to update an identifier
	"PLW0604", # `global` keyword at module level
	"PLW0642", # assignment to `self` or `cls`
	"PLW0711", # `except` with `and`/`or` instead of a tuple
	"PLW1501", # invalid `mode` argument in `open` calls
	"PLW1507", # shallow copy of `os.environ`
	"PLW1508", # `os.getenv` call with an invalid default
	"PLW1509", # `subprocess.Popen` with `preexec_fn`
	"PLW1510", # `subprocess.run` without explicit `check`
	"PLW1641", # `__eq__` without a matching `__hash__`
	"PLW2101", # lock created and discarded in a `with` statement
	"PLW2901", # loop variable overwritten inside the loop body
	"PLW3301", # nested `min`/`max` calls
	# pylint refactor (PLR), bug-class and clear simplifiers only
	"PLR0124", # name compared to itself
	"PLR0133", # comparison between two constants
	"PLR0206", # property defined with extra parameters
	"PLR1704", # loop/try/with variable shadows a function parameter
	"PLR1711", # function ending in a bare `return None`
	"PLR1714", # repeated equality comparison (use `in`)
	"PLR1722", # `exit()`/`quit()` instead of `sys.exit`
	"PLR5501", # `else` block that is just an `if` (use `elif`)
	# pylint conventions (PLC), cherry-picked
	"PLC0105", # type name not matching its parameter variance
	"PLC0131", # `TypeVar` both covariant and contravariant
	"PLC0132", # `TypeVar` name arg not matching assigned variable
	"PLC0205", # single string assigned to `__slots__`
	"PLC0206", # dict iteration using `d[k]` instead of `.items()`
	"PLC0208", # iteration over a set literal of literal values
	"PLC2401", # non-ASCII characters in variable names
	"PLC2403", # non-ASCII characters in import statements
	"PLC3002", # unnecessary direct call to a lambda
	# ported from auto_platforma's API config: error handling, security, test hygiene
	"BLE001",  # blind `except Exception`; narrow it, or noqa with the reason it must stay broad
	"FBT",     # boolean positional parameters and arguments; make the flag keyword-only
	"G004",    # f-string in a logging call; formats eagerly, pass args lazily instead
	"PGH003",  # blanket `# type: ignore` without an error code
	"PGH004",  # blanket `# noqa` without a rule code
	"PLC0415", # import inside a function; noqa only for app-registry/import-order constraints, with the reason
	"PIE",     # flake8-pie: redundant pass/spread/dict kwargs/lambda/range start, duplicate class fields or enum values, chained startswith
	"PT011",   # `pytest.raises` on a broad exception without `match=`
	"PT014",   # duplicate cases in `pytest.mark.parametrize`
	"PT017",   # asserting on the caught exception inside `except`; use `pytest.raises`
	"PT018",   # composite `assert a and b`; split so the failure names the false half
	"RUF001",  # confusable unicode character in a string
	"RUF002",  # confusable unicode character in a docstring
	"RUF003",  # confusable unicode character in a comment
	"S113",    # `requests` call without a timeout
	"S301",    # `pickle` deserialization
	"S302",    # `marshal` deserialization
	"S307",    # `eval()`; use `ast.literal_eval`
	"S324",    # md5/sha1 and friends without `usedforsecurity=False`
	"S501",    # `requests` call with `verify=False`
	"S506",    # `yaml.load` with an unsafe loader
	"S608",    # SQL assembled by string formatting
	# Django injection sinks (not from auto_platforma)
	"S308",    # `mark_safe`; bypasses template autoescaping
	"S610",    # `QuerySet.extra`; raw SQL fragments
	"S611",    # `RawSQL`; raw SQL expression
]
ignore = ["E501", "RET501", "RET504", "SIM103", "SIM108", "SIM118", "W191"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# TID251 exemptions from the outbound-HTTP ban below, each for a stated reason:
# the guard itself is built from the raw clients it bans everywhere else.
"monitoring/safe_fetch.py" = ["TID251"]
# Talks to pytest-django's live_server on loopback, never to a user-supplied URL.
"test_openapi_conformance.py" = ["TID251"]
# Talks to pytest-django's live_server on loopback, never to a user-supplied URL.
"test_api_fuzz.py" = ["TID251"]
# Manual fixture downloaders run by hand from a dev machine; never imported by the app.
"monitoring/tests/scripts/*.py" = ["TID251"]

# Every outbound fetch must go through monitoring.safe_fetch, which pins
# connections to validated public addresses and bounds bodies and time.
# A raw client skips all of that, so CI refuses the usual entry points.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests.get".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.fetch."
"requests.post".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"requests.put".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"requests.patch".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"requests.delete".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"requests.head".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"requests.options".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"requests.request".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.fetch."
"requests.Session".msg = "An unpinned session skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"requests.session".msg = "An unpinned session skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"requests.sessions.Session".msg = "An unpinned session skips the SSRF guard; use monitoring.safe_fetch.guarded_session."
"urllib.request.urlopen".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.fetch."
"urllib.request.urlretrieve".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.fetch."
"urllib3.PoolManager".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch."
"urllib3.request".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch.fetch."
"urllib3.HTTPConnectionPool".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch."
"urllib3.HTTPSConnectionPool".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch."
"urllib3.connection_from_url".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch."
"http.client.HTTPConnection".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch."
"http.client.HTTPSConnection".msg = "Raw outbound HTTP skips the SSRF guard; use monitoring.safe_fetch."
# Not a dependency. Any httpx client would bypass the pinned requests adapter
# entirely, so adopting it has to come with a guarded transport, not slip in.
"httpx".msg = "httpx bypasses the SSRF guard's pinned adapter; route fetches through monitoring.safe_fetch."

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "pydantic.mypy"]
# mutants/ is mutmut's rewritten copy of the source tree (see [tool.mutmut]).
exclude = ["migrations", "\\.venv", "venv", "^mutants/"]
mypy_path = "stubs"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
warn_unreachable = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["*.tests", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.django-stubs]
django_settings_module = "notif.settings_prod"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "notif.settings_test"
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = [
	"--ds=notif.settings_test",
	"-ra",
	"--strict-markers",
	"--strict-config",
	"--tb=short",
	"--reuse-db",
	"--nomigrations",
	# mutmut's rewritten copy of the tree duplicates every test module.
	"--ignore=mutants",
	"--disable-socket",
	"--allow-unix-socket",
	# Loopback only: the live-server conformance test needs a local socket, but an
	# un-mocked HTTP call must fail loudly instead of flaking. With hosts listed,
	# pytest-socket guards socket.connect() only: DNS lookups, UDP and connect_ex
	# still go through.
	"--allow-hosts=127.0.0.1,::1",
	"--timeout=30",
	"-n",
	"4",
]
markers = [
    "slow: marks tests that use real downloaded fixtures (deselect with -m 'not slow')",
    "feed: marks tests specific to FeedStrategy",
    "e2e: end-to-end tests using real downloaded feeds — most directly test parsing correctness",
    "conformance: live-HTTP response validation against the committed openapi.json schema",
    "property: Hypothesis property-based tests that verify invariants across generated inputs",
    "real_ssrf: exercises the real SSRF resolver; exempt from the conftest resolver bypass",
    "fuzz: Schemathesis fuzzing driven by the committed openapi.json against a live server",
]

[tool.mutmut]
# Mutation testing. Deliberately outside the merge path: nothing here runs in
# backend.yml, because a mutation run costs hours and its result is a score to
# read, not a gate to pass. It runs from .github/workflows/deep-sweeps.yml on a
# weekly schedule (and only when enough has changed), or by hand:
#
#     uv run --group mutation mutmut run
#     uv run --group mutation mutmut results
#
# mutmut forks per mutant and refuses to start on native Windows; run it under
# WSL or Linux. It rewrites the sources into a `mutants/` tree and runs pytest
# there.
source_paths = ["accounts", "commons", "monitoring", "notif", "ops"]
do_not_mutate = [
    # Tests cannot meaningfully be mutated — they are the oracle.
    "*/tests.py",
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "conftest.py",
    # Generated or declarative: a mutant here is noise, not a missing assertion.
    "*/migrations/*",
    "notif/settings*.py",
    "notif/asgi.py",
    "notif/wsgi.py",
    "notif/urls.py",
    # mutmut skips decorated functions, and config.py's are all decorated (a
    # pydantic validator, a property), so it yields no mutants today; the entry
    # keeps any later helper out too. test_config.py covers its validation.
    "notif/config.py",
]
# -n 0 overrides addopts' four xdist workers: mutmut maps tests to the functions
# they reach by recording calls in its own process, so the tests must run there,
# and it already runs mutants in parallel. --no-cov keeps pytest-cov out; mutmut
# gathers the line coverage it needs itself. Hypothesis seeds itself from OS
# entropy on every run, independently of pytest-randomly, so a property test
# could kill a mutant on one run and miss it on the next; --hypothesis-seed pins
# it, which also keeps Hypothesis' example database out of the verdict.
# (-p no:randomly repeats what mutmut already passes to its test runs.)
pytest_add_cli_args = ["-n", "0", "-p", "no:randomly", "-q", "--no-cov", "--hypothesis-seed=0"]
# The oracle is the fast unit suite. mutmut reruns every test that reaches a
# mutated function, and the live-server tests (conformance, fuzz) reach most of
# the API layer at a second or more per test; `slow` and `e2e` parse real
# downloaded fixtures. The price: e2e is the most direct check on the parsers,
# so parser mutants it would kill can survive here.
# --ignore, not `-m "not conformance and not fuzz"`: pytest imports a module
# before it evaluates that module's markers, and both modules build their
# OpenAPI schema at import time. Under mutmut the conformance module's import
# fails (PyYAML cannot load openapi-spec-validator's meta-schema), which fails
# the baseline run; --ignore prevents collection outright.
pytest_add_cli_args_test_selection = [
    "--ignore=test_openapi_conformance.py",
    "--ignore=test_api_fuzz.py",
    # Under mutmut this test fails even with no mutant active: PyYAML cannot
    # emit the schema drf-spectacular builds. A fresh pytest process over the
    # same mutants/ tree passes it, so the trigger appears to be mutmut's
    # repeated in-process runs, not the rewritten sources.
    "--deselect=ops/tests.py::OpsApiTestCase::test_openapi_schema_generates",
    "-m",
    "not slow and not e2e",
]
# Only mutate lines the suite executes. A mutant on a line no test reaches can
# never be killed, and would bury the survivors that matter.
mutate_only_covered_lines = true
# mutmut copies source_paths plus this list into mutants/ and runs there. Its
# own defaults (tests/, test*.py and the lock and config files) leave out
# conftest.py, whose autouse SSRF resolver bypass keeps the suite off real DNS;
# without it, tests that reach the guarded transport would resolve hosts for
# real.
also_copy = ["conftest.py", "manage.py", "openapi.json", ".env"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "manage.py",
    "notif/asgi.py",
    "notif/wsgi.py",
    "*/management/commands/*",
]

[tool.coverage.report]
fail_under = 80
