# ── Production compose ────────────────────────────────────────────
# Run with:  docker compose -f compose.yaml --profile prod up -d
# (Without -f, compose.override.yaml is merged — for dev use only.)
#
# Scheduled scraping: add to host crontab:
#   */15 * * * * cd /path/to/notif && docker compose -f compose.yaml exec -T backend python manage.py scrape

services:
  backend:
    build:
      context: ./backend
      args:
        GIT_HASH: ${GIT_HASH:-dev}
    image: notif-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Values forced for the production container.
      # Secrets and domain-specific values stay in backend/.env.
      - DEBUG=false
      - NOTIF_ENV=production
      - SQLITE_PATH=/app/data/db.sqlite3
      - CADDY_ACCESS_LOG_PATH=/app/caddy-logs/access.json
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
      - staticfiles:/app/staticfiles
      - caddy_logs:/app/caddy-logs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req = urllib.request.Request('http://localhost:8000/api/v1/monitoring/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Build-only — runs once per deploy. The entrypoint copies built
  # assets from /image-dist into the frontend_dist volume at /web-dist,
  # which Caddy mounts read-only at the same path.
  frontend:
    build:
      context: ./frontend
      args:
        GIT_HASH: ${GIT_HASH:-dev}
    image: notif-frontend:latest
    restart: "no"
    volumes:
      - frontend_dist:/web-dist

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NOTIF_DOMAIN=${NOTIF_DOMAIN:-notif.lcenzo.com}
      - DJANGO_ADMIN_ROUTE=${DJANGO_ADMIN_ROUTE:-/admin/*}
      - STATIC_ROOT=/app/staticfiles
      - FRONTEND_ROOT=/web-dist
      - BACKEND_UPSTREAM=backend
      - BACKEND_PORT=8000
      - CADDY_ACCESS_LOG=/var/log/caddy/access.json
      - FALLBACK_ROOT=/app/fallback
      - FALLBACK_TLS_CERT=${FALLBACK_TLS_CERT:-/etc/caddy/origin-certs/lcenzo.com.pem}
      - FALLBACK_TLS_KEY=${FALLBACK_TLS_KEY:-/etc/caddy/origin-certs/lcenzo.com.key}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/fallback:/app/fallback:ro
      - /etc/caddy/origin-certs:/etc/caddy/origin-certs:ro
      - staticfiles:/app/staticfiles:ro
      - frontend_dist:/web-dist:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
  staticfiles:
  frontend_dist:
  caddy_data:
  caddy_config:
  caddy_logs:
