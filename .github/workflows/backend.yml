name: Backend CI

on:
  # `push` only fires on long-lived branches; pull_request covers feature
  # branches so we don't double-run CI for every PR push.
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: notif-ci-dummy-key-do-not-use-in-prod
      DJANGO_SETTINGS_MODULE: notif.settings_prod

    steps:
      - uses: actions/checkout@v6

      - name: Set build info
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Django system check
        run: uv run python manage.py check

      - name: Django deploy check
        # Pinned here rather than inherited from config defaults, so the step
        # checks the production posture whichever way those defaults point.
        env:
          DJANGO_SETTINGS_MODULE: notif.settings_prod
          NOTIF_ENV: production
          DEBUG: 'false'
          DEV_BOOTSTRAP_LOGIN_ENABLED: 'false'
        # A fresh random key per run: --deploy rejects short or predictable
        # keys (security.W009), and no secret-looking literal gets committed.
        # A placeholder mail key likewise: without one the console mailer is
        # selected, which --deploy rejects (mail.E001). Nothing is sent.
        run: |
          DJANGO_SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          RESEND_API_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export DJANGO_SECRET_KEY RESEND_API_KEY
          uv run python manage.py check --deploy --fail-level WARNING

      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Migration regressions
        run: uv run pytest -q -n 0 --migrations --create-db monitoring/test_migrations.py

      - name: OpenAPI schema drift
        run: uv run python scripts/check_openapi_drift.py

      - name: Test (pytest + coverage)
        run: uv run pytest -v --cov --cov-report=term
