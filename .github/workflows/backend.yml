name: Backend CI

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'feature/**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: notif-ci-dummy-key-do-not-use-in-prod
      DJANGO_SETTINGS_MODULE: notif.settings

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Type check (pyright)
        run: uvx pyright .

      - name: Test (pytest)
        run: uv run pytest -v
