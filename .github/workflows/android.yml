name: Android CI

# The Kotlin side of the app: the hc_bridge plugin's unit tests and a debug
# APK. Separate from Frontend CI so a Dart-only change skips the Gradle build.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'frontend/android/**'
      - 'frontend/packages/hc_bridge/**'
      - 'frontend/pubspec.yaml'
      - 'frontend/pubspec.lock'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'frontend/android/**'
      - 'frontend/packages/hc_bridge/**'
      - 'frontend/pubspec.yaml'
      - 'frontend/pubspec.lock'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Writes local.properties and the Gradle wrapper (both gitignored)
      # without building, so the Kotlin tests can fail before the APK build.
      - name: Generate Gradle config
        run: flutter build apk --config-only --no-pub

      - name: hc_bridge unit tests
        working-directory: frontend/android
        run: ./gradlew :hc_bridge:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bridge-test-reports
          path: frontend/build/hc_bridge/reports/tests/
          if-no-files-found: ignore
