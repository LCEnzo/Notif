name: Deep Test Sweeps

# Non-gating sweeps, weekly when enough backend code changed or on demand: see docs/testing.md.

on:
  workflow_dispatch:
    inputs:
      sweeps:
        description: 'Which sweeps to run'
        type: choice
        default: 'both'
        options: ['both', 'fuzz', 'mutation']
      force:
        description: 'Run even if little has changed'
        type: boolean
        default: true
  schedule:
    # Mondays, 03:00 UTC.
    - cron: '0 3 * * 1'

permissions:
  contents: read

# One run at a time: a second run waits for the first instead of paying for the
# same hours of sweeping twice in parallel.
concurrency:
  group: deep-sweeps
  cancel-in-progress: false

env:
  # A scheduled run sweeps only when at least this many lines of non-test
  # backend source were added or removed within CHANGE_WINDOW.
  CHANGE_THRESHOLD: 200
  CHANGE_WINDOW: '7 days ago'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      changed_lines: ${{ steps.check.outputs.changed_lines }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The gate diffs against a commit from a week ago, which a shallow
          # clone does not contain.
          fetch-depth: 0

      - name: Measure backend churn in the window
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "changed_lines=forced" >> "$GITHUB_OUTPUT"
            echo "Manual run with force enabled; skipping the churn gate."
            exit 0
          fi

          base="$(git rev-list -1 --before="$CHANGE_WINDOW" HEAD || true)"
          if [ -z "$base" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "changed_lines=unknown" >> "$GITHUB_OUTPUT"
            echo "No commit older than $CHANGE_WINDOW; running rather than skipping silently."
            exit 0
          fi

          # Counts churn in the code under test only. Tests and migrations are
          # left out, although new tests alone can move the mutation score.
          changed="$(
            git diff --numstat "$base" HEAD -- \
              backend/accounts backend/commons backend/monitoring backend/notif backend/ops \
            | grep -vE '(/migrations/|/tests/|/tests\.py$|/test_[^/]*\.py$|_test\.py$)' \
            | awk '{ added += $1; removed += $2 } END { print added + removed + 0 }'
          )"

          echo "changed_lines=$changed" >> "$GITHUB_OUTPUT"
          echo "Backend source churn since $base ($CHANGE_WINDOW): $changed lines (threshold $CHANGE_THRESHOLD)."

          if [ "$changed" -ge "$CHANGE_THRESHOLD" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Below threshold — skipping this week's sweeps."
          fi

  fuzz-deep:
    needs: gate
    if: needs.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.sweeps == 'both' || inputs.sweeps == 'fuzz')
    runs-on: ubuntu-latest
    # Every operation is also capped by its own pytest timeout; this bounds the
    # whole job well below GitHub's 6-hour default.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: notif-ci-dummy-key-do-not-use-in-prod  # pragma: allowlist secret
      DJANGO_SETTINGS_MODULE: notif.settings_test
      NOTIF_FUZZ_PROFILE: deep

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      # Findings do not fail the job; pipefail keeps pytest's exit status. See docs/testing.md.
      - name: Deep schema fuzz
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest -q test_api_fuzz.py --junitxml=../fuzz-report.xml | tee ../fuzz-report.txt

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-fuzz-report
          path: |
            fuzz-report.txt
            fuzz-report.xml
          retention-days: 30

  mutation:
    needs: gate
    if: needs.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.sweeps == 'both' || inputs.sweeps == 'mutation')
    runs-on: ubuntu-latest
    # GitHub's limit for hosted runners. A full sweep is expected to take hours,
    # and mutmut leaves the mutants with the slowest covering tests for last.
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: notif-ci-dummy-key-do-not-use-in-prod  # pragma: allowlist secret
      DJANGO_SETTINGS_MODULE: notif.settings_test

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen --group mutation

      # Step timeout below the job's, so partial results still upload: see docs/testing.md.
      - name: Mutation sweep
        continue-on-error: true
        timeout-minutes: 330
        run: uv run --frozen --group mutation mutmut run

      - name: Collect results
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --frozen --group mutation mutmut results | tee ../mutation-results.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-results.txt
          retention-days: 30
