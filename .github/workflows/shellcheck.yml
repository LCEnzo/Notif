name: Shellcheck

on:
  # `push` only fires on long-lived branches; pull_request covers feature
  # branches so we don't double-run CI for every PR push.
  push:
    branches: [master]
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      # shellcheck ships on the runner image (apt cmd_packages in
      # actions/runner-images toolset-2404.json), so there is no install step.
      # git ls-files picks up new scripts without editing this file.
      # --verbose logs the command line, so a green run shows what it checked.
      - name: Shellcheck tracked scripts
        # Explicit bash adds pipefail: a failing git ls-files fails the step.
        shell: bash
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --verbose --no-run-if-empty shellcheck
