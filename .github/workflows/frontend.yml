name: Frontend CI

on:
  # `push` only fires on long-lived branches; pull_request covers feature
  # branches so we don't double-run CI for every PR push.
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      # The contract-freshness step tracks the backend schema; without this
      # path a backend-only schema change would skip the gate entirely and
      # merge with stale generated models.
      - 'backend/openapi.json'
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'backend/openapi.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # After pub get: trailing_commas comes from very_good_analysis through a
      # package: include, and the language version from package_config.json.
      # Before codegen and builds: `.` skips hidden dirs (.dart_tool/) but not
      # build/, so here it sees exactly the tracked Dart.
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # The generated Dart models must track backend/openapi.json. The refresh
      # script copies the schema into the gitignored swagger/ and regenerates;
      # a diff (including untracked files via intent-to-add, in case a
      # generator version emits a new file) means the committed models are
      # stale and this PR/commit must include them.
      - name: Contract freshness (generated models match backend schema)
        run: |
          python3 scripts/refresh_contract.py
          git add -N .
          git diff --exit-code

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build web (smoke test)
        run: flutter build web --no-pub
