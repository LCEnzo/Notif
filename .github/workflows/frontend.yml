name: Frontend CI

on:
  # `push` only fires on long-lived branches; pull_request covers feature
  # branches so we don't double-run CI for every PR push.
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The generated Dart models must track backend/openapi.json. The refresh
      # script re-copies the schema and regenerates; a diff (including
      # untracked files via intent-to-add, in case a generator version emits a
      # new file) means the committed artifacts are stale and this PR/commit
      # must include them.
      - name: Contract freshness (generated models match backend schema)
        run: |
          python3 scripts/refresh_contract.py
          git add -N .
          git diff --exit-code

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build web (smoke test)
        run: flutter build web --no-pub
