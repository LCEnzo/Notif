<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lcenzo.com</title>
  <script>
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = prefersDark ? "dark" : "light";
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ed;
      --fg: #171717;
      --muted: #62605a;
      --rule: #d8d1c5;
      --accent: #245f73;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111313;
      --fg: #f1eee7;
      --muted: #aaa59a;
      --rule: #34302a;
      --accent: #7fb6c8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 520px);
      border-top: 1px solid var(--rule);
      padding-top: 28px;
    }

    .code {
      margin: 0 0 10px;
      color: var(--accent);
      font: 700 13px/1.2 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.1;
      font-weight: 700;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      border-top: 1px solid var(--rule);
    }

    li {
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
      display: flex;
      gap: 16px;
      align-items: baseline;
    }

    li a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      flex-shrink: 0;
    }

    li a:hover,
    li a:focus {
      text-decoration: underline;
    }

    li span {
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">lcenzo.com</p>
    <h1>Luka Colić</h1>
    <p>Personal domain. A short list of things hosted here.</p>
    <ul>
      <li>
        <a href="https://notif.lcenzo.com">notif</a>
        <span>— a personal scraper / notification dashboard.</span>
      </li>
    </ul>
  </main>
</body>
</html>
