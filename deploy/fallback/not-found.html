<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Not found | lcenzo.com</title>
  <script>
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = prefersDark ? "dark" : "light";
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ed;
      --fg: #171717;
      --muted: #62605a;
      --rule: #d8d1c5;
      --accent: #245f73;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111313;
      --fg: #f1eee7;
      --muted: #aaa59a;
      --rule: #34302a;
      --accent: #7fb6c8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 520px);
      border-top: 1px solid var(--rule);
      padding-top: 28px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .code {
      margin-bottom: 10px;
      color: var(--accent);
      font: 700 13px/1.2 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.1;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Not found</h1>
    <p>This hostname is not configured.</p>
  </main>
</body>
</html>
